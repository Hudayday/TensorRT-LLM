<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="328" viewBox="0 0 1000 328" font-family="'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="1000" height="328" fill="#f5f5f5"/>
<rect x="20" y="20" width="304" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="34" y="42" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">SCALE</text>
<text x="34" y="84" font-size="30" font-weight="700" fill="#eb6c36">6.12B</text>
<text x="34" y="106" font-size="12.5" fill="#4f5d75">requests served in one production year</text>
<rect x="348" y="20" width="304" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="362" y="42" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">PROMPT-HEAVY</text>
<text x="362" y="84" font-size="30" font-weight="700" fill="#eb6c36">14×</text>
<text x="362" y="106" font-size="12.5" fill="#4f5d75">more input tokens than output tokens</text>
<rect x="676" y="20" width="304" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="690" y="42" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">SHORTER OUTPUTS</text>
<text x="690" y="84" font-size="30" font-weight="700" fill="#eb6c36">&lt;100</text>
<text x="690" y="106" font-size="12.5" fill="#4f5d75">median output tokens, down from a few</text>
<text x="690" y="121" font-size="12.5" fill="#4f5d75">hundred</text>
<rect x="20" y="162" width="304" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="34" y="184" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">KV FOOTPRINT</text>
<text x="34" y="226" font-size="30" font-weight="700" fill="#eb6c36">27 GB</text>
<text x="34" y="248" font-size="12.5" fill="#4f5d75">of KV state for one 100K-token context</text>
<rect x="348" y="162" width="304" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="362" y="184" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">REUSE WINDOW</text>
<text x="362" y="226" font-size="30" font-weight="700" fill="#eb6c36">99%</text>
<text x="362" y="248" font-size="12.5" fill="#4f5d75">of repeat requests arrive within 15 minutes</text>
<rect x="676" y="162" width="304" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="690" y="184" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">HOT REUSE</text>
<text x="690" y="226" font-size="30" font-weight="700" fill="#eb6c36">50%</text>
<text x="690" y="248" font-size="12.5" fill="#4f5d75">of repeat requests arrive within 0.1 seconds</text>
<text x="20" y="306" font-size="10" fill="#4f5d75">Source: W. Nixon et al., “A Year in LLM Serving: Workload Evolution, Caching and Load-Balancing”, arXiv:2608.13573 (2026), one-year production trace, April 2025 to April 2026.</text>
</svg>

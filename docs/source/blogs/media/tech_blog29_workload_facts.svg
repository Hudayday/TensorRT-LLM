<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="296" viewBox="0 0 1000 296" font-family="'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="1000" height="296" fill="#f5f5f5"/>
<rect x="16" y="16" width="230" height="124" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="28" y="46" font-size="22" font-weight="600" fill="#2d3142">Scale</text>
<text x="28" y="80" font-size="30" font-weight="700" fill="#eb6c36">6.12B</text>
<text x="28" y="102" font-size="12.5" fill="#4f5d75">requests served in one</text>
<text x="28" y="117" font-size="12.5" fill="#4f5d75">production year</text>
<rect x="262" y="16" width="230" height="124" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="274" y="46" font-size="22" font-weight="600" fill="#2d3142">Prompt-heavy</text>
<text x="274" y="80" font-size="30" font-weight="700" fill="#eb6c36">14×</text>
<text x="274" y="102" font-size="12.5" fill="#4f5d75">more input tokens than output</text>
<text x="274" y="117" font-size="12.5" fill="#4f5d75">tokens</text>
<rect x="508" y="16" width="230" height="124" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="520" y="46" font-size="22" font-weight="600" fill="#2d3142">Shorter outputs</text>
<text x="520" y="80" font-size="30" font-weight="700" fill="#eb6c36">&lt;100</text>
<text x="520" y="102" font-size="12.5" fill="#4f5d75">median output tokens, down</text>
<text x="520" y="117" font-size="12.5" fill="#4f5d75">from a few hundred</text>
<rect x="754" y="16" width="230" height="124" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="766" y="46" font-size="22" font-weight="600" fill="#2d3142">KV footprint</text>
<text x="766" y="80" font-size="30" font-weight="700" fill="#eb6c36">27 GB</text>
<text x="766" y="102" font-size="12.5" fill="#4f5d75">of KV state for one 100K-token</text>
<text x="766" y="117" font-size="12.5" fill="#4f5d75">context</text>
<rect x="139" y="156" width="230" height="124" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="151" y="186" font-size="22" font-weight="600" fill="#2d3142">Reuse window</text>
<text x="151" y="220" font-size="30" font-weight="700" fill="#eb6c36">99%</text>
<text x="151" y="242" font-size="12.5" fill="#4f5d75">of repeat requests arrive within</text>
<text x="151" y="257" font-size="12.5" fill="#4f5d75">15 minutes</text>
<rect x="385" y="156" width="230" height="124" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="397" y="186" font-size="22" font-weight="600" fill="#2d3142">Hot reuse</text>
<text x="397" y="220" font-size="30" font-weight="700" fill="#eb6c36">50%</text>
<text x="397" y="242" font-size="12.5" fill="#4f5d75">of repeat requests arrive within</text>
<text x="397" y="257" font-size="12.5" fill="#4f5d75">0.1 seconds</text>
<rect x="631" y="156" width="230" height="124" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="643" y="186" font-size="22" font-weight="600" fill="#2d3142">Reusable prefix</text>
<text x="643" y="220" font-size="30" font-weight="700" fill="#eb6c36">96.5%</text>
<text x="643" y="242" font-size="12.5" fill="#4f5d75">of the prompt tokens in agentic</text>
<text x="643" y="257" font-size="12.5" fill="#4f5d75">coding jobs</text>
</svg>

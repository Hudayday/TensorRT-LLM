<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="342" viewBox="0 0 1000 342" font-family="'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="1000" height="342" fill="#f5f5f5"/>
<rect x="20" y="20" width="222" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="34" y="42" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">SCALE</text>
<text x="34" y="84" font-size="30" font-weight="700" fill="#eb6c36">6.12B</text>
<text x="34" y="106" font-size="12.5" fill="#4f5d75">requests served in one</text>
<text x="34" y="121" font-size="12.5" fill="#4f5d75">production year</text>
<rect x="266" y="20" width="222" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="280" y="42" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">PROMPT-HEAVY</text>
<text x="280" y="84" font-size="30" font-weight="700" fill="#eb6c36">14×</text>
<text x="280" y="106" font-size="12.5" fill="#4f5d75">more input tokens than output</text>
<text x="280" y="121" font-size="12.5" fill="#4f5d75">tokens</text>
<rect x="512" y="20" width="222" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="526" y="42" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">SHORTER OUTPUTS</text>
<text x="526" y="84" font-size="30" font-weight="700" fill="#eb6c36">&lt;100</text>
<text x="526" y="106" font-size="12.5" fill="#4f5d75">median output tokens, down</text>
<text x="526" y="121" font-size="12.5" fill="#4f5d75">from a few hundred</text>
<rect x="758" y="20" width="222" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="772" y="42" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">KV FOOTPRINT</text>
<text x="772" y="84" font-size="30" font-weight="700" fill="#eb6c36">27 GB</text>
<text x="772" y="106" font-size="12.5" fill="#4f5d75">of KV state for one 100K-token</text>
<text x="772" y="121" font-size="12.5" fill="#4f5d75">context</text>
<rect x="143" y="162" width="222" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="157" y="184" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">REUSE WINDOW</text>
<text x="157" y="226" font-size="30" font-weight="700" fill="#eb6c36">99%</text>
<text x="157" y="248" font-size="12.5" fill="#4f5d75">of repeat requests arrive</text>
<text x="157" y="263" font-size="12.5" fill="#4f5d75">within 15 minutes</text>
<rect x="389" y="162" width="222" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="403" y="184" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">HOT REUSE</text>
<text x="403" y="226" font-size="30" font-weight="700" fill="#eb6c36">50%</text>
<text x="403" y="248" font-size="12.5" fill="#4f5d75">of repeat requests arrive</text>
<text x="403" y="263" font-size="12.5" fill="#4f5d75">within 0.1 seconds</text>
<rect x="635" y="162" width="222" height="118" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
<text x="649" y="184" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.4" fill="#4f5d75">REUSABLE PREFIX</text>
<text x="649" y="226" font-size="30" font-weight="700" fill="#eb6c36">96.5%</text>
<text x="649" y="248" font-size="12.5" fill="#4f5d75">of the prompt tokens in</text>
<text x="649" y="263" font-size="12.5" fill="#4f5d75">agentic coding jobs</text>
<text x="20" y="306" font-size="10" fill="#4f5d75">Sources: first six tiles, W. Nixon et al., “A Year in LLM Serving: Workload Evolution, Caching and Load-Balancing”, arXiv:2608.13573 (2026), one-year production trace, April 2025 to April 2026.</text>
<text x="20" y="320" font-size="10" fill="#4f5d75">Last tile: TensorRT LLM tech blog 27, “Evaluating Agentic Serving with Trace Replay and Job-Level Metrics”, mean optimal prefix-cache hit rate of the SWE-bench coding traces.</text>
</svg>
